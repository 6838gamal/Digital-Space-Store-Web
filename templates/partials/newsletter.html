<!-- ===== NEWSLETTER ===== -->
<section class="newsletter-section">
  <div class="container">
    <div class="newsletter-inner">

      <div class="newsletter-text">
        <h3 data-en="📬 Get a free product every month" data-ar="📬 احصل على منتج مجاني كل شهر">
          📬 Get a free product every month
        </h3>
      </div>

      <form class="newsletter-form" action="/subscribe" method="POST">
        <input type="email" name="email" required
               data-en-placeholder="Your email..." data-ar-placeholder="بريدك الإلكتروني..."
               placeholder="Your email...">
        <button type="submit" data-en="Subscribe" data-ar="اشترك">Subscribe</button>
      </form>

    </div>
  </div>
</section>
